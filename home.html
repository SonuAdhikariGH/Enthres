<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#f6f2ff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b0c1a"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="app.css" />
    <title>Enthres - Liberty at your palm</title>
  </head>
  <body>
    <!-- theme toggle (CSS-only, does not touch app.js) -->
    <input
      type="checkbox"
      id="themeToggle"
      class="theme-switch-input"
      aria-label="Toggle dark mode"
    />
    <label for="themeToggle" class="theme-switch">
      <span class="theme-icon sun">☀</span>
      <span class="theme-icon moon">☾</span>
      <span class="theme-switch-thumb"></span>
    </label>

    <!-- brand -->
    <div class="brand">
      <p class="brand-mark">Enthres</p>
      <p class="brand-tag">Liberty at your palm</p>
    </div>

    <!-- social handles container -->
    <div class="socialHandles-container">
      <a target="_blank" rel="noopener" href="https://github.com/sanuenthres">
        <span class="social-icon" aria-hidden="true">🐙</span>GitHub
      </a>
      <a target="_blank" rel="noopener" href="https://x.com/sanuenthres">
        <span class="social-icon" aria-hidden="true">✕</span>X
      </a>
    </div>

    <!-- navbar -->
    <nav class="navbar-container">
      <a href="#home">Home</a>
      <a href="#tasks">Tasks</a>
      <a href="#quotes">Quotes</a>
    </nav>

    <!-- main section -->
    <section id="home" class="dashboard-section">
      <!-- funcional container. i.e. ccompleted tasks, ongoing tasks & total tasks -->

      <div class="mainDashboard-container">
        <!-- ongoing tasks -->
        <div class="ongoing-tasks">
          <span class="ongoingTask-label">Ongoing Tasks</span>
          <p id="ongoingTaskNumber"></p>
        </div>

        <!-- completed tasks -->
        <div class="completed-tasks">
          <span class="completedTask-label">Completed Tasks</span>
          <p id="completedTaskNumber"></p>
        </div>

        <!-- total tasks -->
        <div class="total-tasks">
          <span class="totalTask-label">Total Tasks</span>
          <p id="totalTaskNumber"></p>
        </div>
      </div>
      <div class="btn-container">
        <a id="createTaskRedirect" href="#tasks">Create Task</a>
      </div>
    </section>

    <!-- tasks section -->
    <section id="tasks" class="tasks-section">
      <!-- header -->
      <h2 class="taskSec-header">Create task</h2>

      <!-- main task elements -->
      <div class="taskMain-container">
        <input id="taskName" placeholder="Enter the task" />
        <select id="categorySelect">
          <option value="">--Category--</option>
          <option value="Chores">Chores</option>
          <option value="Gym">Gym</option>
          <option value="Studies">Studies</option>
          <option value="Coding">Coding</option>
          <option value="Work">Work</option>
          <option value="Bill">Bill</option>
        </select>

        <div class="createBtn-container">
          <button id="createBtn">Create</button>
        </div>
      </div>

      <!-- task list container -->
      <div id="taskListContainer" class="taskList-container">
        <ul id="taskListMain"></ul>
      </div>
    </section>

    <!-- quote section -->
    <section id="quotes" class="quote-section">
      <h2 class="quoteSec-header">Get Quotes</h2>
      <!-- main quote functional container -->
      <div class="mainQuote-container">
        <p id="quoteContent"></p>
        <p id="quoteAuthor">Generate a quote to save it here.</p>

        <div class="quoteBtn-container">
          <button id="generateQuoteBtn">Generate Quote</button>
          <button id="saveQuoteBtn">Save Quote</button>
        </div>
      </div>

      <!-- quote list container -->
      <div id="quoteListContainer" class="quoteList-container">
        <ul id="mainQuoteList"></ul>
      </div>
    </section>

    <p class="watermark">Made by sanu adhikari ❤️</p>
  </body>
  <script type="module" src="app.js"></script>
</html>
